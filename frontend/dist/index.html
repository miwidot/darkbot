<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'">
<title>darkbot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="sprite" width="0" height="0" aria-hidden="true">
  <symbol id="i-gear" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M19.4 13.5a7.7 7.7 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.6 7.6 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.7 7.7 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.4-2-1.6Z"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-speaker" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></symbol>
</svg>

<div class="shell">
  <header class="bar">
    <div class="brand">darkbot</div>
    <nav class="views" data-i18n-aria-label="view.nav">
      <button data-view="dash" data-i18n="view.dash"></button>
      <button data-view="sounds" data-i18n="view.sounds"></button>
      <button data-view="events" data-i18n="view.events"></button>
    </nav>
    <div class="signals" aria-live="polite">
      <span class="signal" id="sigTwitch" tabindex="0" data-tip="tip.sigTwitch"><i></i><span></span></span>
      <span class="signal" id="sigEvents" tabindex="0" data-tip="tip.sigEvents"><i></i><span></span></span>
      <span class="signal" id="sigObs" tabindex="0" data-tip="tip.sigObs"><i></i><span></span></span>
    </div>
    <div class="bar-end">
      <button class="update-chip hidden" id="updateChip"></button>
      <button class="icon-btn" id="openSettings" data-i18n-aria-label="bar.settings" data-i18n-title="bar.settings"><svg><use href="#i-gear"/></svg></button>
    </div>
  </header>

  <main class="stage">
    <section class="board view" id="viewDash" aria-labelledby="dashTitle">
      <div class="board-head">
        <h1 id="dashTitle" data-i18n="dash.title"></h1>
        <span class="count" id="dashSince"></span>
        <button class="btn quiet" id="dashReset" data-i18n="dash.reset" data-i18n-title="dash.resetTitle"></button>
      </div>

      <div class="reconnect hidden" id="reconnect">
        <span data-i18n="board.reconnect"></span>
        <button class="btn primary" id="reconnectBtn" data-i18n="board.reconnectBtn"></button>
      </div>

      <div class="onboard hidden" id="onboard">
        <h2 data-i18n="board.onboardTitle"></h2>
        <p data-i18n="board.onboardText"></p>
        <button class="btn primary" id="onboardConnect" data-i18n="board.onboardBtn"></button>
      </div>

      <div id="dashBody">
        <h2 class="meter-group" data-i18n="dash.groupChannel"></h2>
        <div class="meters" id="metersChannel"></div>
        <h2 class="meter-group" data-i18n="dash.groupBot"></h2>
        <div class="meters" id="meters"></div>
        <div class="ranks">
          <section class="rank">
            <h2 data-i18n="dash.topSounds"></h2>
            <ol class="rank-list" id="topSounds"></ol>
            <p class="rank-empty" id="topSoundsEmpty" data-i18n="dash.topSoundsEmpty"></p>
          </section>
          <section class="rank">
            <h2 data-i18n="dash.topViewers"></h2>
            <ol class="rank-list" id="topViewers"></ol>
            <p class="rank-empty" id="topViewersEmpty" data-i18n="dash.topViewersEmpty"></p>
          </section>
        </div>
        <section class="logins-wrap" aria-labelledby="loginsTitle">
          <h2 id="loginsTitle"><span data-i18n="logins.title"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.logins" data-i18n-aria-label="tip.more"></span></h2>
          <div class="logins" id="logins"></div>
        </section>
      </div>
    </section>

    <section class="board view hidden" id="viewSounds" aria-labelledby="boardTitle">
      <div class="board-head">
        <h1 id="boardTitle" data-i18n="board.title"></h1>
        <span class="count" id="soundCount"></span>
        <button class="btn primary" id="addSound"><svg><use href="#i-plus"/></svg><span data-i18n="board.add"></span></button>
      </div>

      <div class="pads" id="pads"></div>
      <div class="pads-empty hidden" id="padsEmpty">
        <p data-i18n="board.emptyText"></p>
        <button class="btn" id="emptyAdd" data-i18n="board.emptyBtn"></button>
      </div>
      <p class="board-hint" id="boardHint" data-i18n="board.hint"></p>
    </section>

    <section class="board view hidden" id="viewEvents" aria-labelledby="eventsTitle">
      <div class="board-head">
        <h1 id="eventsTitle" data-i18n="events.title"></h1>
      </div>
      <p class="lede events-lede" data-i18n="events.lede"></p>
      <p class="notice hidden" id="eventsReconnect" data-i18n="events.reconnect"></p>
      <div class="unfollow-box">
        <label class="check"><input type="checkbox" id="unfollowDetection"> <span data-i18n="events.unfollowDetection"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.unfollow" data-i18n-aria-label="tip.more"></span></label>
        <p class="hint" id="unfollowStatus"></p>
      </div>
      <ul class="event-list" id="eventList"></ul>
    </section>

    <aside class="feed" aria-labelledby="feedTitle">
      <h2 id="feedTitle" data-i18n="feed.title"></h2>
      <ol class="feed-list" id="feed"></ol>
      <p class="feed-empty" id="feedEmpty" data-i18n="feed.empty"></p>
    </aside>
  </main>

  <footer class="strip">
    <button class="strip-output" id="stripOutput" data-i18n-title="strip.change">
      <svg><use href="#i-speaker"/></svg><span id="outputName"></span>
    </button>
    <a class="credit" id="credit" href="https://tarkov-stammtisch.de" data-i18n-title="credit.title"><span data-i18n="credit.text"></span> <b>Tarkov Stammtisch</b></a>
    <label class="strip-master">
      <span data-i18n="strip.master"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.master" data-i18n-aria-label="tip.more"></span>
      <input type="range" id="master" min="0.05" max="1" step="0.05" data-i18n-aria-label="strip.masterAria">
      <output id="masterVal"></output>
    </label>
  </footer>
</div>

<!-- SETTINGS -->
<dialog class="sheet" id="settings" aria-labelledby="settingsTitle">
  <div class="sheet-head">
    <h2 id="settingsTitle" tabindex="-1" autofocus data-i18n="settings.title"></h2>
    <button class="icon-btn" id="closeSettings" data-i18n-aria-label="settings.close"><svg><use href="#i-close"/></svg></button>
  </div>
  <div class="sheet-body">
    <nav class="sheet-nav" data-i18n-aria-label="settings.nav">
      <button data-sec="general" data-i18n="nav.general"></button>
      <button data-sec="audio" class="active" data-i18n="nav.audio"></button>
      <button data-sec="twitch" data-i18n="nav.twitch"></button>
      <button data-sec="obs" data-i18n="nav.obs"></button>
      <button data-sec="songs" data-i18n="nav.songs"></button>
      <button data-sec="updates" data-i18n="nav.updates"></button>
      <button data-sec="log" data-i18n="nav.log"></button>
    </nav>

    <div class="sheet-content">
      <!-- GENERAL -->
      <section class="sec" id="sec-general">
        <h3 data-i18n="general.title"></h3>
        <div class="field">
          <label for="language"><span data-i18n="general.language"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.language" data-i18n-aria-label="tip.more"></span></label>
          <select id="language"></select>
          <p class="hint" data-i18n="general.languageHint"></p>
        </div>
        <label class="check" id="autostartRow"><input type="checkbox" id="autostart"> <span data-i18n="general.autostart"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.autostart" data-i18n-aria-label="tip.more"></span></label>
        <label class="check hidden" id="closeToTrayRow"><input type="checkbox" id="closeToTray"> <span data-i18n="general.closeToTray"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.closeToTray" data-i18n-aria-label="tip.more"></span></label>
      </section>

      <!-- AUDIO -->
      <section class="sec active" id="sec-audio">
        <h3 data-i18n="audio.title"></h3>
        <div class="choice">
          <label class="choice-item"><input type="radio" name="mode" value="device">
            <span><b><span data-i18n="audio.modeDevice"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.modeDevice" data-i18n-aria-label="tip.more"></span></b><small data-i18n="audio.modeDeviceText"></small></span></label>
          <label class="choice-item"><input type="radio" name="mode" value="obs">
            <span><b><span data-i18n="audio.modeObs"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.modeObs" data-i18n-aria-label="tip.more"></span></b><small data-i18n="audio.modeObsText"></small></span></label>
        </div>

        <div id="deviceBlock">
          <div class="field">
            <label for="device"><span data-i18n="audio.device"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.device" data-i18n-aria-label="tip.more"></span></label>
            <div class="inline"><select id="device"></select><button class="btn" id="refreshDevices" data-i18n="audio.refresh"></button></div>
            <p class="hint" id="deviceHint"></p>
          </div>
        </div>

        <div id="obsBlock">
          <div class="field">
            <span class="label"><span data-i18n="audio.tracks"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.tracks" data-i18n-aria-label="tip.more"></span></span>
            <div class="tracks" id="tracks" role="group" data-i18n-aria-label="audio.tracksAria"></div>
            <p class="hint" data-i18n="audio.tracksHint"></p>
          </div>
          <div class="field">
            <label for="obsInput"><span data-i18n="audio.inputName"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.inputName" data-i18n-aria-label="tip.more"></span></label>
            <input id="obsInput" type="text" maxlength="100">
            <p class="hint" data-i18n="audio.inputHint"></p>
          </div>
        </div>
        <div class="sec-actions"><button class="btn primary" id="saveAudio" data-i18n="audio.save"></button></div>
      </section>

      <!-- TWITCH -->
      <section class="sec" id="sec-twitch">
        <h3 data-i18n="twitch.title"></h3>
        <p class="lede" id="twitchStatus"></p>
        <div class="login hidden" id="loginBox">
          <p data-i18n="twitch.enterCode"></p>
          <div class="code" id="loginCode"></div>
          <div class="inline center"><button class="btn" id="loginLink" data-i18n="twitch.openActivate"></button><button class="btn quiet" id="cancelLogin" data-i18n="twitch.cancel"></button></div>
        </div>
        <div class="sec-actions start">
          <button class="btn primary" id="login" data-i18n="twitch.connect"></button>
          <button class="btn danger hidden" id="logout" data-i18n="twitch.disconnect"></button>
        </div>
        <p class="hint" data-i18n="twitch.affiliateHint"></p>
      </section>

      <!-- OBS -->
      <section class="sec" id="sec-obs">
        <h3 data-i18n="obs.title"></h3>
        <p class="lede" data-i18n="obs.lede"></p>
        <div class="grid2">
          <div class="field"><label for="obsHost"><span data-i18n="obs.host"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.obsHost" data-i18n-aria-label="tip.more"></span></label><input id="obsHost" type="text"></div>
          <div class="field"><label for="obsPort"><span data-i18n="obs.port"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.obsPort" data-i18n-aria-label="tip.more"></span></label><input id="obsPort" type="number" min="1" max="65535"></div>
        </div>
        <div class="field"><label for="obsPass"><span data-i18n="obs.password"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.obsPassword" data-i18n-aria-label="tip.more"></span></label><input id="obsPass" type="password" autocomplete="off" data-i18n-placeholder="obs.passwordKeep"></div>
        <label class="check"><input type="checkbox" id="obsAuto"> <span data-i18n="obs.auto"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.obsAuto" data-i18n-aria-label="tip.more"></span></label>
        <div class="sec-actions">
          <span class="status" id="obsStatus"></span>
          <button class="btn hidden" id="obsDisconnect" data-i18n="obs.disconnect"></button>
          <button class="btn primary" id="obsConnect"></button>
        </div>
      </section>

      <!-- SONG REQUESTS -->
      <section class="sec" id="sec-songs">
        <h3 data-i18n="songs.title"></h3>
        <p class="lede" data-i18n="songs.lede"></p>
        <p class="notice hidden" id="songsChatHint" data-i18n="songs.chatMissing"></p>

        <div class="songs-status">
          <span class="status" id="spotifyStatus"></span>
          <button class="btn danger hidden" id="spotifyLogout" data-i18n="songs.disconnect"></button>
        </div>

        <details class="more" id="spotifySetup">
          <summary data-i18n="songs.setupSummary"></summary>
          <ol class="steps">
            <li data-i18n="songs.step1"></li>
            <li><span data-i18n="songs.step2"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.redirect" data-i18n-aria-label="tip.more"></span>
              <div class="inline copy"><input id="spotifyRedirect" type="text" readonly><button type="button" class="btn" id="copyRedirect" data-i18n="songs.copy"></button></div></li>
            <li data-i18n="songs.step3"></li>
            <li data-i18n="songs.step4"></li>
          </ol>
          <div class="field">
            <label for="spotifyClientId"><span data-i18n="songs.clientId"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.spotifyClientId" data-i18n-aria-label="tip.more"></span></label>
            <input id="spotifyClientId" type="text" autocomplete="off" spellcheck="false">
          </div>
          <div class="sec-actions start">
            <button class="btn primary" id="spotifyLogin" data-i18n="songs.connect"></button>
            <button class="btn quiet" id="openSpotifyDashboard" data-i18n="songs.openDashboard"></button>
          </div>
          <div class="login hidden" id="spotifyPasteBox">
            <p data-i18n="songs.pasteHelp"></p>
            <div class="field">
              <label for="spotifyPaste"><span data-i18n="songs.pasteLabel"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.spotifyPaste" data-i18n-aria-label="tip.more"></span></label>
              <input id="spotifyPaste" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="songs.pastePlaceholder">
            </div>
            <div class="inline">
              <button class="btn primary" id="spotifyFinish" data-i18n="songs.finish"></button>
              <button class="btn" id="spotifyReopen" data-i18n="songs.reopen"></button>
              <button class="btn quiet" id="spotifyCancel" data-i18n="twitch.cancel"></button>
            </div>
          </div>
        </details>

        <label class="check"><input type="checkbox" id="songsEnabled"> <span data-i18n="songs.enabled"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.songsEnabled" data-i18n-aria-label="tip.more"></span></label>
        <div class="grid2">
          <div class="field">
            <label for="songsCooldown"><span data-i18n="songs.cooldown"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.songsCooldown" data-i18n-aria-label="tip.more"></span></label>
            <input id="songsCooldown" type="number" min="0" step="1">
            <p class="hint" data-i18n="songs.cooldownHint"></p>
          </div>
          <div class="field">
            <label for="songsMax"><span data-i18n="songs.maxMinutes"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.songsMax" data-i18n-aria-label="tip.more"></span></label>
            <input id="songsMax" type="number" min="0" step="1">
            <p class="hint" data-i18n="songs.maxHint"></p>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="songsExplicit"> <span data-i18n="songs.blockExplicit"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.songsExplicit" data-i18n-aria-label="tip.more"></span></label>
        <label class="check"><input type="checkbox" id="songsRequesterSkip"> <span data-i18n="songs.requesterSkip"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.songsRequesterSkip" data-i18n-aria-label="tip.more"></span></label>
        <label class="check"><input type="checkbox" id="songsReplies"> <span data-i18n="songs.replies"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.songsReplies" data-i18n-aria-label="tip.more"></span></label>

        <div class="commands">
          <h4 data-i18n="songs.commandsTitle"></h4>
          <dl>
            <dt>!sr</dt><dd data-i18n="songs.cmdSr"></dd>
            <dt>!song</dt><dd data-i18n="songs.cmdSong"></dd>
            <dt>!next</dt><dd data-i18n="songs.cmdNext"></dd>
            <dt>!queue</dt><dd data-i18n="songs.cmdQueue"></dd>
            <dt>!skip</dt><dd data-i18n="songs.cmdSkip"></dd>
          </dl>
        </div>
        <p class="hint" data-i18n="songs.legal"></p>
        <div class="sec-actions"><button class="btn primary" id="saveSongs" data-i18n="songs.save"></button></div>
      </section>

      <!-- UPDATES -->
      <section class="sec" id="sec-updates">
        <h3 data-i18n="updates.title"></h3>
        <p class="lede" id="updateStatus"></p>
        <label class="check"><input type="checkbox" id="autoUpdate"> <span data-i18n="updates.auto"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.autoUpdate" data-i18n-aria-label="tip.more"></span></label>
        <p class="hint" data-i18n="updates.autoHint"></p>
        <div class="notes hidden" id="updateNotes"></div>
        <div class="sec-actions start">
          <button class="btn" id="checkUpdate" data-i18n="updates.check"></button>
          <button class="btn primary hidden" id="installUpdate"></button>
        </div>
      </section>

      <!-- LOG -->
      <section class="sec" id="sec-log">
        <h3 data-i18n="log.title"></h3>
        <pre class="log" id="log"></pre>
      </section>
    </div>
  </div>
</dialog>

<!-- SOUND EDITOR -->
<dialog class="modal" id="editor" aria-labelledby="editorTitle">
  <h2 id="editorTitle"></h2>
  <div class="segmented" role="radiogroup" data-i18n-aria-label="editor.rewardAria">
    <label><input type="radio" name="edSource" value="new" checked><span data-i18n="editor.newReward"></span></label>
    <label><input type="radio" name="edSource" value="existing"><span data-i18n="editor.existingReward"></span></label>
  </div>
  <div id="edNewBlock">
    <div class="grid2 wide-first">
      <div class="field">
        <label for="edTitle"><span data-i18n="editor.rewardName"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.rewardName" data-i18n-aria-label="tip.more"></span></label>
        <input id="edTitle" type="text" maxlength="45" data-i18n-placeholder="editor.rewardNamePlaceholder">
      </div>
      <div class="field">
        <label for="edCost"><span data-i18n="editor.price"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.price" data-i18n-aria-label="tip.more"></span></label>
        <input id="edCost" type="number" min="1" max="1000000000" step="1">
      </div>
    </div>
    <div class="field">
      <label for="edColor"><span data-i18n="editor.color"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.rewardColor" data-i18n-aria-label="tip.more"></span></label>
      <div class="color-row">
        <input id="edColor" type="color" data-i18n-title="editor.colorPick" data-i18n-aria-label="editor.colorPick">
        <input id="edColorHex" type="text" maxlength="7" spellcheck="false" autocomplete="off" placeholder="#9147FF" data-i18n-aria-label="editor.colorHex">
        <div class="swatches" id="edSwatches" role="group" data-i18n-aria-label="editor.colorSuggestions"></div>
      </div>
    </div>
    <p class="hint" data-i18n="editor.newHint"></p>
  </div>
  <div id="edExistingBlock" class="hidden">
    <div class="field">
      <label for="edReward"><span data-i18n="editor.reward"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.existingReward" data-i18n-aria-label="tip.more"></span></label>
      <div class="inline"><select id="edReward"></select><button type="button" class="btn" id="edRefreshRewards" data-i18n="editor.reload"></button></div>
      <p class="hint" id="edRewardHint"></p>
      <p class="hint" data-i18n="editor.existingHint"></p>
    </div>
  </div>
  <div class="field">
    <label for="edFile"><span data-i18n="editor.file"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.file" data-i18n-aria-label="tip.more"></span></label>
    <div class="inline"><input id="edFile" type="text" readonly data-i18n-placeholder="editor.filePlaceholder"><button type="button" class="btn" id="edPick" data-i18n="editor.chooseFile"></button></div>
  </div>
  <div class="field">
    <label for="edVolume"><span data-i18n="editor.volume"></span> <output id="edVolumeVal"></output> <span class="tip" tabindex="0" role="button" data-tip="tip.volume" data-i18n-aria-label="tip.more"></span></label>
    <input id="edVolume" type="range" min="0.05" max="1" step="0.05">
  </div>
  <div class="grid2">
    <div class="field">
      <label for="edCooldown"><span data-i18n="editor.cooldown"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.cooldown" data-i18n-aria-label="tip.more"></span></label>
      <input id="edCooldown" type="number" min="0" step="1">
      <p class="hint" data-i18n="editor.cooldownHint"></p>
    </div>
    <div class="field">
      <label for="edUserCooldown"><span data-i18n="editor.userCooldown"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.userCooldown" data-i18n-aria-label="tip.more"></span></label>
      <input id="edUserCooldown" type="number" min="0" step="1">
      <p class="hint" data-i18n="editor.userCooldownHint"></p>
    </div>
  </div>
  <label class="check"><input type="checkbox" id="edEnabled"> <span data-i18n="editor.enabled"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.enabled" data-i18n-aria-label="tip.more"></span></label>
  <p class="error hidden" id="edError" role="alert"></p>
  <div class="modal-actions">
    <button type="button" class="btn danger quiet hidden" id="edDelete"></button>
    <span class="spacer"></span>
    <button type="button" class="btn quiet" id="edCancel" data-i18n="editor.cancel"></button>
    <button type="button" class="btn primary" id="edSave"></button>
  </div>
</dialog>

<!-- EVENT ACTION EDITOR -->
<dialog class="modal" id="evEditor" aria-labelledby="evTitle">
  <h2 id="evTitle"></h2>
  <p class="hint ev-desc" id="evDesc"></p>
  <label class="check"><input type="checkbox" id="evEnabled"> <span data-i18n="evedit.enabled"></span></label>
  <div class="field">
    <label for="evSound"><span data-i18n="evedit.sound"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.evSound" data-i18n-aria-label="tip.more"></span></label>
    <div class="inline"><input id="evSound" type="text" readonly data-i18n-placeholder="evedit.noSound"><button type="button" class="btn" id="evPick" data-i18n="editor.chooseFile"></button><button type="button" class="btn quiet" id="evClear" data-i18n="evedit.clear"></button></div>
  </div>
  <div class="field">
    <label for="evVolume"><span data-i18n="editor.volume"></span> <output id="evVolumeVal"></output></label>
    <input id="evVolume" type="range" min="0.05" max="1" step="0.05">
  </div>
  <div class="field" id="evChatField">
    <label for="evChat"><span data-i18n="evedit.chat"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.evChat" data-i18n-aria-label="tip.more"></span></label>
    <input id="evChat" type="text" maxlength="500" data-i18n-placeholder="evedit.chatPlaceholder">
    <p class="hint" data-i18n="evedit.chatHint"></p>
  </div>
  <div class="field" id="evMinField">
    <label for="evMin"><span data-i18n="evedit.minAmount"></span> <span class="tip" tabindex="0" role="button" data-tip="tip.evMin" data-i18n-aria-label="tip.more"></span></label>
    <input id="evMin" type="number" min="0" step="1">
    <p class="hint" data-i18n="evedit.minHint"></p>
  </div>
  <p class="error hidden" id="evError" role="alert"></p>
  <div class="modal-actions">
    <button type="button" class="btn quiet" id="evTest" data-i18n="events.test"></button>
    <span class="spacer"></span>
    <button type="button" class="btn quiet" id="evCancel" data-i18n="editor.cancel"></button>
    <button type="button" class="btn primary" id="evSave" data-i18n="evedit.save"></button>
  </div>
</dialog>

<div class="toast hidden" id="toast" role="status"></div>

<script src="i18n.js"></script>
<script src="tooltip.js"></script>
<script src="app.js"></script>
</body>
</html>
