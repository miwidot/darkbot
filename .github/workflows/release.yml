# Publishes a GitHub release when a version tag (v1.2.3) is pushed.
# Runs only on GitHub-hosted standard runners, which are free for public
# repositories. Asset names must match selfupdate.AssetName().
name: release

on:
  push:
    tags: ["v*.*.*"]

# Least privilege: only the publish job may write to the repository.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux,   asset: darkbot-linux-amd64 }
          - { os: ubuntu-24.04, target: windows, asset: darkbot-windows-amd64.exe }
          - { os: macos-14,     target: mac,     asset: darkbot-macos-arm64 }
          # Intel Macs: cross-built on Apple Silicon (no paid/retired Intel runner)
          - { os: macos-14,     target: mac,     asset: darkbot-macos-amd64, goarch: amd64, cc: "clang -arch x86_64" }
    runs-on: ${{ matrix.os }}
    env:
      ASSET: ${{ matrix.asset }}
      TARGET: ${{ matrix.target }}
      # Optional repo variable: a public Twitch Client ID baked into releases so
      # users don't have to register their own Twitch app.
      CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Linux GUI dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Test
        if: matrix.goarch == ''
        run: go vet ./internal/... && go test ./internal/...
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "${{ matrix.goarch }}" ]; then export GOARCH="${{ matrix.goarch }}" CGO_ENABLED=1 CC="${{ matrix.cc }}"; fi
          make "$TARGET" VERSION="$VERSION" CLIENT_ID="$CLIENT_ID"
          mkdir -p dist
          case "$TARGET" in
            linux)   cp build/bin/darkbot-linux "dist/$ASSET" ;;
            windows) cp build/bin/darkbot.exe "dist/$ASSET" ;;
            mac)
              # raw binary for the self-updater, zipped .app for first installs
              cp build/bin/darkbot.app/Contents/MacOS/darkbot "dist/$ASSET"
              (cd build/bin && ditto -c -k --keepParent darkbot.app "../../dist/$ASSET.app.zip") ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "darkbot $GITHUB_REF_NAME" --generate-notes
