# Publishes a GitHub release when a version tag (v1.2.3) is pushed.
# Runs only on GitHub-hosted standard runners, which are free for public
# repositories. Asset names must match selfupdate.AssetName().
name: release

on:
  push:
    tags: ["v*.*.*"]

# Least privilege: only the publish job may write to the repository.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux,   asset: darkbot-linux-amd64 }
          - { os: ubuntu-24.04, target: windows, asset: darkbot-windows-amd64.exe }
          - { os: macos-15,     target: mac,     asset: darkbot-macos-arm64 }
          # Intel Macs: cross-built on Apple Silicon (no paid/retired Intel runner)
          - { os: macos-15,     target: mac,     asset: darkbot-macos-amd64, goarch: amd64, cc: "clang -arch x86_64" }
    runs-on: ${{ matrix.os }}
    env:
      ASSET: ${{ matrix.asset }}
      TARGET: ${{ matrix.target }}
      # Optional repo variable: overrides the built-in Twitch Client ID
      # (app.go). Empty = keep the built-in one.
      CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Ubuntu's package mirrors sometimes stall for many minutes; each
      # attempt is time-boxed and retried instead of hanging the job.
      - name: Linux GUI dependencies
        if: matrix.target == 'linux'
        timeout-minutes: 20
        run: |
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for attempt in 1 2 3; do
            if timeout 300 $APT update && timeout 600 $APT install -y libgtk-3-dev libwebkit2gtk-4.1-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed or timed out, retrying"
            sleep 10
          done
          exit 1
      - name: Test
        if: matrix.goarch == ''
        run: go vet ./internal/... && go test ./internal/...
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "${{ matrix.goarch }}" ]; then export GOARCH="${{ matrix.goarch }}" CGO_ENABLED=1 CC="${{ matrix.cc }}"; fi
          make "$TARGET" VERSION="$VERSION" CLIENT_ID="$CLIENT_ID"
          mkdir -p dist
          case "$TARGET" in
            linux)   cp build/bin/darkbot-linux "dist/$ASSET" ;;
            windows) cp build/bin/darkbot.exe "dist/$ASSET" ;;
            mac)
              # raw binary for the self-updater, zipped .app for first installs
              cp build/bin/darkbot.app/Contents/MacOS/darkbot "dist/$ASSET"
              (cd build/bin && ditto -c -k --keepParent darkbot.app "../../dist/$ASSET.app.zip") ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # all tags and commits, for the release notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # Notes from the commit messages since the previous tag: we commit
        # straight to main, so --generate-notes (pull requests only) would
        # list nothing but a compare link.
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "darkbot $GITHUB_REF_NAME" --notes-file notes.md
