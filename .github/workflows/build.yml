# Builds and tests darkbot on all three platforms for every push / PR.
# Uses only GitHub-hosted standard runners, which are free for public repos.
# Linux and macOS need native runners (cgo + system web view); Windows
# cross-compiles without a C compiler.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            artifact: build/bin/darkbot-linux
          - os: macos-15
            target: mac
            artifact: build/bin/darkbot.app
          - os: ubuntu-24.04
            target: windows
            artifact: build/bin/darkbot.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Linux GUI dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Test
        run: go vet ./internal/... && go test -race ./internal/...
      - name: App tests
        if: matrix.target == 'mac'
        run: go vet . && go test -race .
      # Known vulnerabilities in Go or a dependency that darkbot's code
      # actually reaches fail the build (pinned version, no install).
      - name: Vulnerability check
        if: matrix.target == 'mac'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags desktop,production ./...
      - name: Build
        run: make ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darkbot-${{ matrix.target }}
          path: ${{ matrix.artifact }}

  # The Windows build above is cross-compiled on Linux, so Windows-only code
  # (autostart registry, process wait, tray) is tested here on real Windows.
  test-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Test
        run: go vet ./internal/... && go test ./internal/...
